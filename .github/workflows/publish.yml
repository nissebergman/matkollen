name: Publish Offers

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-offers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: npm test

      - name: Refresh Snapshots
        id: refresh
        continue-on-error: true
        run: npm run snapshot

      - name: Commit refreshed Snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/snapshots/
          if git diff --cached --quiet; then
            echo "No Snapshot changes to commit."
          else
            git commit -m "Update Offer Snapshots"
            git push
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build app and Snapshots
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report Snapshot refresh failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::At least one Chain refresh failed; the partial Snapshot was published."
          exit 1
